# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Theme Settings
#
# Review documentation to determine if you should use `theme` or `remote_theme`
# https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/#installing-the-theme

# theme                  : "minimal-mistakes-jekyll"
remote_theme           : "mmistakes/minimal-mistakes"
minimal_mistakes_skin    : "mint" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale                   : "en-US" # English locale for international audience
rtl                      : # true, false (default) # turns direction of the page into right to left for RTL languages
title                    : "PowerPlatformTip"
title_separator          : "-"
subtitle                 : "Learn and find tips & tricks around the PowerPlatformTip" # site tagline that appears below site title in masthead
name                     : "Marcel Lehmann"
description              : "Learn and find tips & tricks around the Power Platform. Your go-to source for insights on Power Apps, Power Automate, and more, by Marcel Lehmann, BizzApps MVP."
url: "https://www.powerplatformtip.com" # Canonical = www (matches CNAME served by GitHub Pages; non-www 301s to www)
baseurl: ""
repository: "MarceLehmann/PowerPlatformTip_LIVE"
teaser                   : # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
breadcrumbs              : true # true, false (default) - SEO optimization enabled
words_per_minute         : 200
enable_copy_code_button  : true # true, false (default)
future                   : false
copyright                : # "copyright" name, defaults to site.title
copyright_url            : # "copyright" URL, defaults to site.url
comments:
  provider               : false
reCaptcha:
  siteKey                :
  secret                 :
atom_feed:
  hide: false  # Changed to false - enable Atom feed for RSS readers
  path: feed.xml  # Explicit path for the feed
search                   : true # true, false (default)
search_full_content      : true # true, false (default)
search_provider          : lunr # lunr (default), algolia, google
lunr:
  search_within_pages    : # true, false (default)
algolia:
  application_id         : # YOUR_APPLICATION_ID
  index_name             : # YOUR_INDEX_NAME
  search_only_api_key    : # YOUR_SEARCH_ONLY_API_KEY
  powered_by             : # true (default), false
google:
  search_engine_id       : # YOUR_SEARCH_ENGINE_ID
  instant_search         : # false (default), true
# SEO Related
google_site_verification :
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Sitemap settings (for jekyll-sitemap plugin)
defaults_sitemap: &defaults_sitemap
  changefreq: weekly
  priority: 0.7

# Pages to exclude from sitemap
sitemap_exclude:
  - /404.html
  - /search/
  - /page:num/
  - /CONTENT/
  - /DOCS/
  - /SOCIALMEDIA/
  - /GOOGLESEARCHCONSOLE/
  - /NEWOPTIMIZEDPOSTS/
  
# Feed settings (for jekyll-feed plugin)  
feed:
  path: feed.xml
  excerpt_only: false

# Social Sharing
twitter:
  username               : # add your X/Twitter handle (without @) to enable Twitter Cards
facebook:
  username               :
  app_id                 :
  publisher              :
# Open Graph/Twitter default site image (fallback for pages without a header image).
# NOTE: replace with a dedicated 1200x630 og-image.jpg for best previews; .jfif is a fallback only.
og_image                 : "/assets/images/bio-photo.jfif"
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : Person # Person or Organization (defaults to Person)
  name                   : "Marcel Lehmann" # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles
    - "https://www.linkedin.com/in/marcelehmann/"
    - "https://mvp.microsoft.com/de-DE/MVP/profile/f67ec6c7-f116-ee11-8f6e-000d3a1ad36b"

# Analytics
analytics:
  provider               : "google-gtag" # false (default), "google", "google-universal", "google-gtag", "custom"
  google:
    tracking_id          : "G-27YESV8PVL"
    anonymize_ip         : true # respect privacy defaults


# Site Author
author:
  name             : "Marcel Lehmann"
  avatar           : "/assets/images/bio-photo.jfif"
  bio              : "BizzApps MVP from Switzerland 🇨🇭 - PowerPlatform Expert & Evangelist & MVP - Turning passion into expertise"
  location         : "Switzerland"
  email            : # your-email@example.com
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://kmupower.com"
    # - label: "Email"
    #   icon: "fas fa-fw fa-envelope-square"
    #   url: "mailto:marcel.lehmann@kmupower.com" # Uncomment and fill if you want to show email
    #- label: "GitHub"
    #  icon: "fab fa-fw fa-github"
    #  url: "https://github.com/MarceLehmann" # Your GitHub profile
    # Add other social links like LinkedIn, Twitter if desired
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/marcelehmann/"
    # - label: "Twitter"
    #   icon: "fab fa-fw fa-twitter-square"
    #   url: "https://twitter.com/yourprofile"

# Site Footer
footer:
  links:
   # - label: "GitHub"
   #   icon: "fab fa-fw fa-github"
   #   url: "https://github.com/MarceLehmann/PowerPlatformTip" # Link to the blog's repository
    - label: "Website" # Link to your main website
      icon: "fas fa-fw fa-link"
      url: "https://kmupower.com"
    # Add other relevant footer links
    # - label: "Twitter"
    #   icon: "fab fa-fw fa-twitter-square"
    #   url: "https://twitter.com/yourprofile"


# Reading Files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - minimal-mistakes-jekyll.gemspec
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs # ignore Minimal Mistakes /docs
  - /test # ignore Minimal Mistakes /test
  # Internal working folders / reports - must NOT be published (were "Crawled - currently not indexed" in GSC)
  - CONTENT
  - DOCS
  - SOCIALMEDIA
  - GOOGLESEARCHCONSOLE
  - NEWOPTIMIZEDPOSTS
  - "SEO-OPTIMIZATION-REPORT*"
  - "SEO-CONTENT-AUDIT-CHECKLIST*"
  - "FINALE-ZUSAMMENFASSUNG*"
  - "VERIFICATION_REPORT*"
  - "*.ps1"
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Pagination with jekyll-paginate
paginate: 5 # amount of posts to show
paginate_path: /page:num/

# Pagination with jekyll-paginate-v2
# See https://github.com/sverrirs/jekyll-paginate-v2/blob/master/README-GENERATOR.md#site-configuration
#   for configuration details
pagination:
  # Set enabled to true to use paginate v2
  # enabled: true
  debug: false
  collection: 'posts'
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true
  category: 'posts'
  tag: ''
  locale: ''
  trail:
    before: 2
    after: 2


# Plugins (previously gems:)
# GitHub Pages supported plugins for optimal SEO
plugins:
  - jekyll-paginate
  - jekyll-sitemap         # Auto-generate XML sitemap
  - jekyll-feed            # Auto-generate Atom feed
  - jekyll-seo-tag         # Comprehensive SEO meta tags
  - jekyll-redirect-from   # Handle 301 redirects
  - jekyll-gist
  - jekyll-include-cache

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-gist
  - jekyll-include-cache


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path>/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path>/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# NOTE: Individual tag/category pages are generated but should have noindex
# They are utility pages without unique content
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development


# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: true
      share: true
      related: true
      show_date: true
      toc: true
      toc_sticky: false
      sitemap: true  # Include in sitemap
      robots: "index, follow"  # Allow indexing
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      sitemap: true  # Include in sitemap
      robots: "index, follow"  # Allow indexing
  # Pagination pages - noindex
  - scope:
      path: "page:num"
      type: pages
    values:
      sitemap: false
      robots: "noindex, follow"
  # Search page - noindex
  - scope:
      path: "search"
      type: pages
    values:
      sitemap: false
      robots: "noindex, follow"
