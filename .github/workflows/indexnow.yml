name: IndexNow Ping

# Meldet die Kern-URLs nach jedem Content-Push an IndexNow (Bing, Copilot,
# Yandex u. a.), damit neue oder geaenderte Seiten schneller gecrawlt werden.
# Ergaenzt die normale Sitemap-Erfassung; ersetzt sie nicht.

on:
  push:
    branches:
      - master
      - main
    paths:
      - '_posts/**'
      - '_pages/**'
      - '_includes/**'
      - 'llms.txt'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit Kern-URLs an IndexNow
        run: |
          curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{
              "host": "www.powerplatformtip.com",
              "key": "363df83c959f7d239713353630049a67",
              "keyLocation": "https://www.powerplatformtip.com/363df83c959f7d239713353630049a67.txt",
              "urlList": [
                "https://www.powerplatformtip.com/",
                "https://www.powerplatformtip.com/posts/",
                "https://www.powerplatformtip.com/topics/",
                "https://www.powerplatformtip.com/about/",
                "https://www.powerplatformtip.com/article/powerplatform/2022/08/30/how-to-restore-create-backup-flow/",
                "https://www.powerplatformtip.com/article/powerplatform/2022/05/18/power-apps-elevated-permissions-power-automate/",
                "https://www.powerplatformtip.com/article/powerplatform/2022/11/10/extract-html-table-email-power-automate/",
                "https://www.powerplatformtip.com/article/powerplatform/2022/04/20/implement-onkeydown-onkeypress-powerapps-text-input/",
                "https://www.powerplatformtip.com/article/powerplatform/2022/03/09/power-automate-flows-vs-automate-rules/",
                "https://www.powerplatformtip.com/article/powerplatform/2021/08/23/power-apps-refresh-alternative-method-performance/"
              ]
            }'
